  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const ACCESS_PASSWORD = 'media0501';

    const loadData = (key, fallback) => {
      try {
        const saved = JSON.parse(localStorage.getItem(key));
        if (!saved || Object.keys(saved).length === 0) return fallback;
        return { ...fallback, ...saved };
      } catch { return fallback; }
    };
    const saveData = (key, data) => localStorage.setItem(key, JSON.stringify(data));

    function exportToExcel(editData, shootData, year, month) {
      const monthStr = String(month).padStart(2, '0');
      const wb = XLSX.utils.book_new();

      const editHeader = ['No.', '의뢰부서', '컨텐츠', '영상(편)', '러닝타임(분)', '총 영상 시간(분)', '편집 기간(일)', '담당자'];
      const editRows = editData.map(r => [r.no, r.dept, r.content, r.videos, r.runtime, r.totalTime, r.period, r.manager]);
      const editTotals = editData.reduce((acc, r) => [acc[0] + r.videos, acc[1] + r.runtime, acc[2] + r.totalTime, acc[3] + r.period], [0, 0, 0, 0]);
      editRows.push(['', '', '합계', editTotals[0], editTotals[1], editTotals[2], editTotals[3], '']);
      const ws1 = XLSX.utils.aoa_to_sheet([editHeader, ...editRows]);
      ws1['!cols'] = [{wch:5},{wch:10},{wch:25},{wch:10},{wch:14},{wch:16},{wch:14},{wch:10}];
      XLSX.utils.book_append_sheet(wb, ws1, `${monthStr}월 편집`);

      const shootHeader = ['No.', '컨텐츠', '영상(편)', '러닝타임(분)', '총 영상 시간(분)', '촬영 기간(일)', '담당자'];
      const shootRows = shootData.map(r => [r.no, r.content, r.videos, r.runtime, r.totalTime, r.period, r.manager]);
      const shootTotals = shootData.reduce((acc, r) => [acc[0] + r.videos, acc[1] + r.runtime, acc[2] + r.totalTime, acc[3] + r.period], [0, 0, 0, 0]);
      shootRows.push(['', '합계', shootTotals[0], shootTotals[1], shootTotals[2], shootTotals[3], '']);
      const ws2 = XLSX.utils.aoa_to_sheet([shootHeader, ...shootRows]);
      ws2['!cols'] = [{wch:5},{wch:25},{wch:10},{wch:14},{wch:16},{wch:14},{wch:10}];
      XLSX.utils.book_append_sheet(wb, ws2, `${monthStr}월 촬영`);

      XLSX.writeFile(wb, `영상팀_${year}년_${monthStr}월_작업량.xlsx`);
    }

    function LoginPage({ onLogin }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === ACCESS_PASSWORD) {
          sessionStorage.setItem('authenticated', 'true');
          onLogin();
        } else {
          setError(true);
          setTimeout(() => setError(false), 2000);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 flex items-center justify-center px-4">
          <div className="w-full max-w-sm">
            <div className="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
              <div className="text-center mb-6">
                <div className="w-14 h-14 rounded-xl bg-gray-900 flex items-center justify-center mx-auto mb-4">
                  <svg className="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </div>
                <h1 className="text-xl font-bold text-gray-900">영상팀 월별 작업량</h1>
                <p className="text-sm text-gray-500 mt-1">비밀번호를 입력해주세요</p>
              </div>
              <form onSubmit={handleSubmit}>
                <div className="mb-4">
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="비밀번호"
                    className={`w-full border rounded-lg px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:ring-2 transition-colors ${
                      error ? 'border-red-400 focus:ring-red-300 bg-red-50' : 'border-gray-300 focus:ring-gray-400'
                    }`}
                    autoFocus
                  />
                  {error && <p className="text-red-500 text-xs text-center mt-2">비밀번호가 올바르지 않습니다</p>}
                </div>
                <button type="submit" className="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-lg font-medium transition-colors">
                  입장하기
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [selectedYear, setSelectedYear] = useState(() => Number(sessionStorage.getItem('selectedYear')) || 2026);
      const [selectedMonth, setSelectedMonth] = useState(() => Number(sessionStorage.getItem('selectedMonth')) || 6);
      const [allEditData, setAllEditData] = useState(() => loadData('editData', INITIAL_EDIT));
      const [allShootData, setAllShootData] = useState(() => loadData('shootData', INITIAL_SHOOT));
      const [showEditModal, setShowEditModal] = useState(false);
      const [showShootModal, setShowShootModal] = useState(false);
      const [lastSaved, setLastSaved] = useState(() => sessionStorage.getItem('lastSaved') || '');
      const [saveFlash, setSaveFlash] = useState(false);
      const [editingRow, setEditingRow] = useState(null);
      const [editingType, setEditingType] = useState(null);

      // Auto-save to localStorage
      useEffect(() => { saveData('editData', allEditData); }, [allEditData]);
      useEffect(() => { saveData('shootData', allShootData); }, [allShootData]);
      useEffect(() => { sessionStorage.setItem('selectedYear', selectedYear); sessionStorage.setItem('selectedMonth', selectedMonth); }, [selectedYear, selectedMonth]);

      const handleSave = () => {
        saveData('editData', allEditData);
        saveData('shootData', allShootData);
        const now = new Date();
        const timeStr = now.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        sessionStorage.setItem('lastSaved', timeStr);
        setLastSaved(timeStr);
        setSaveFlash(true);
        setTimeout(() => setSaveFlash(false), 1500);
      };

      const monthKey = `${selectedYear}-${selectedMonth}`;
      const monthStr = String(selectedMonth).padStart(2, '0') + '월';
      const editData = allEditData[monthKey] || [];
      const shootData = allShootData[monthKey] || [];

      const editTotals = useMemo(() => ({
        videos: editData.reduce((s, r) => s + r.videos, 0),
        runtime: editData.reduce((s, r) => s + r.runtime, 0),
        totalTime: editData.reduce((s, r) => s + r.totalTime, 0),
        period: editData.reduce((s, r) => s + r.period, 0),
      }), [editData]);

      const shootTotals = useMemo(() => ({
        videos: shootData.reduce((s, r) => s + r.videos, 0),
        runtime: shootData.reduce((s, r) => s + r.runtime, 0),
        totalTime: shootData.reduce((s, r) => s + r.totalTime, 0),
        period: shootData.reduce((s, r) => s + r.period, 0),
      }), [shootData]);

      const prevMonth = () => {
        if (selectedMonth === 1) { setSelectedYear(y => y - 1); setSelectedMonth(12); }
        else { setSelectedMonth(m => m - 1); }
      };
      const nextMonth = () => {
        if (selectedMonth === 12) { setSelectedYear(y => y + 1); setSelectedMonth(1); }
        else { setSelectedMonth(m => m + 1); }
      };

        setAllEditData(prev => {
          const cur = prev[monthKey] || [];
          return { ...prev, [monthKey]: [...cur, { ...row, id: Date.now(), no: cur.length + 1 }] };
        });
        setShowEditModal(false);
      };

      const addShootRow = (row) => {
        setAllShootData(prev => {
          const cur = prev[monthKey] || [];
          return { ...prev, [monthKey]: [...cur, { ...row, id: Date.now(), no: cur.length + 1 }] };
        });
        setShowShootModal(false);
      };

      const deleteEditRow = (id) => {
        setAllEditData(prev => ({
          ...prev,
          [monthKey]: (prev[monthKey] || []).filter(r => r.id !== id).map((r, i) => ({ ...r, no: i + 1 }))
        }));
      };

      const deleteShootRow = (id) => {
        setAllShootData(prev => ({
          ...prev,
          [monthKey]: (prev[monthKey] || []).filter(r => r.id !== id).map((r, i) => ({ ...r, no: i + 1 }))
        }));
      };

      const updateEditRow = (updated) => {
        setAllEditData(prev => ({
          ...prev,
          [monthKey]: (prev[monthKey] || []).map(r => r.id === updated.id ? updated : r)
        }));
        setEditingRow(null);
        setEditingType(null);
      };

      const updateShootRow = (updated) => {
        setAllShootData(prev => ({
          ...prev,
          [monthKey]: (prev[monthKey] || []).map(r => r.id === updated.id ? updated : r)
        }));
        setEditingRow(null);
        setEditingType(null);
      };

      const openEditModal = (row) => { setEditingRow(row); setEditingType('edit'); };
      const openShootModal = (row) => { setEditingRow(row); setEditingType('shoot'); };

      return (
        <div className="min-h-screen bg-gray-50">

            <div className="flex items-center gap-3">
              <h1 className="text-xl font-bold text-gray-900">월별 작업량</h1>
              <button onClick={() => exportToExcel(editData, shootData, selectedYear, selectedMonth)} className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-colors shadow-sm">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                엑셀 내보내기
              </button>
              <button onClick={() => { location.reload(true); }} className="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>

                >

              <button onClick={nextMonth} className="p-2 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition-colors">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-8">
            {/* 편집 */}
            <DataSection
              title={`${selectedYear}년 ${monthStr} 편집`}
              theme="edit"
              columns={['의뢰부서', 'No.', '컨텐츠', '영상(편)', '러닝타임(분)', '총 영상 시간(분)', '편집 기간(일)', '담당자', '']}
              data={editData}
              totals={editTotals}
              onAdd={() => setShowEditModal(true)}
              onDelete={deleteEditRow}
              onEdit={openEditModal}
              renderRow={(row) => [
                <span className="inline-block bg-gray-100 text-gray-700 text-xs font-medium px-2 py-0.5 rounded">{row.dept}</span>,
                <span className="text-gray-400 font-mono text-xs">{row.no}</span>,
                <span className="text-gray-900 font-medium">{row.content}</span>,
                <span className="font-semibold text-gray-700">{row.videos}</span>,
                <span className="text-gray-600">{row.runtime}</span>,
                <span className="text-gray-600">{row.totalTime}</span>,
                <span className="text-gray-600">{row.period}</span>,
                <span className="text-gray-600">{row.manager}</span>,
              ]}
              footerColSpan={3}
            />

            {/* 촬영 */}
            <DataSection
              title={`${selectedYear}년 ${monthStr} 촬영`}
              theme="shoot"
              columns={['No.', '컨텐츠', '영상(편)', '러닝타임(분)', '총 영상 시간(분)', '촬영 기간(일)', '담당자', '']}
              data={shootData}
              totals={shootTotals}
              onAdd={() => setShowShootModal(true)}
              onDelete={deleteShootRow}
              onEdit={openShootModal}
              renderRow={(row) => [
                <span className="text-gray-400 font-mono text-xs">{row.no}</span>,
                <span className="text-gray-900 font-medium">{row.content}</span>,
                <span className="font-semibold text-gray-700">{row.videos}</span>,
                <span className="text-gray-600">{row.runtime}</span>,
                <span className="text-gray-600">{row.totalTime}</span>,
                <span className="text-gray-600">{row.period}</span>,
                <span className="text-gray-600">{row.manager}</span>,
              ]}
              footerColSpan={2}
            />

            {/* Summary Cards */}
            <section className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <SummaryCard label="편집 영상(편)" value={editTotals.videos} color="edit" icon="video" />
              <SummaryCard label="편집 러닝타임(분)" value={editTotals.runtime} color="gray" icon="clock" />
              <SummaryCard label="편집 총 영상 시간(분)" value={editTotals.totalTime} color="shoot" icon="clock" />
              <SummaryCard label="편집 기간(일)" value={editTotals.period} color="amber" icon="clipboard" />
              <SummaryCard label="촬영 영상(편)" value={shootTotals.videos} color="shoot" icon="video" />
              <SummaryCard label="촬영 러닝타임(분)" value={shootTotals.runtime} color="gray" icon="clock" />
              <SummaryCard label="촬영 총 영상 시간(분)" value={shootTotals.totalTime} color="edit" icon="clock" />
              <SummaryCard label="촬영 기간(일)" value={shootTotals.period} color="amber" icon="clipboard" />
            </section>
          </main>

          {showEditModal && <AddModal title="편집 작업 추가" type="edit" accent="edit" onClose={() => setShowEditModal(false)} onAdd={addEditRow} />}
          {showShootModal && <AddModal title="촬영 작업 추가" type="shoot" accent="shoot" onClose={() => setShowShootModal(false)} onAdd={addShootRow} />}
          {editingRow && editingType === 'edit' && <AddModal title="편집 작업 수정" type="edit" accent="edit" initial={editingRow} onClose={() => { setEditingRow(null); setEditingType(null); }} onAdd={updateEditRow} />}
          {editingRow && editingType === 'shoot' && <AddModal title="촬영 작업 수정" type="shoot" accent="shoot" initial={editingRow} onClose={() => { setEditingRow(null); setEditingType(null); }} onAdd={updateShootRow} />}
        </div>
      );
    }

    function DataSection({ title, theme, columns, data, totals, onAdd, onDelete, onEdit, renderRow, footerColSpan }) {
      const isEdit = theme === 'edit';
      const iconPath = isEdit
        ? "M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
        : "M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z";

      return (
        <section className="mb-10">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className={`w-10 h-10 rounded-xl bg-${theme}-100 flex items-center justify-center`}>
                <svg className={`w-5 h-5 text-${theme}-600`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={iconPath} />
                </svg>
              </div>
              <h2 className="text-lg font-bold text-gray-900">{title}</h2>
              <span className={`text-xs font-medium bg-${theme}-100 text-${theme}-700 px-2 py-0.5 rounded-full`}>{data.length}건</span>
            </div>
            <button onClick={onAdd} className={`flex items-center gap-1 bg-${theme}-500 hover:bg-${theme}-600 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm`}>
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
              </svg>
              추가
            </button>
          </div>
          <div className={`bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm border-l-4 border-l-${theme}-500`}>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className={`bg-${theme}-50 border-b border-${theme}-100`}>
                    {columns.map((col, i) => (
                      <th key={i} className={`px-4 py-3.5 text-center font-semibold text-${theme}-700 text-xs uppercase tracking-wider`}>{col}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {data.map((row, idx) => (
                    <tr key={row.id} className={`hover:bg-${theme}-50/50 transition-colors ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/30'}`}>
                      {renderRow(row).map((cell, i) => (
                        <td key={i} className="px-4 py-3.5 text-center">{cell}</td>
                      ))}
                      <td className="px-4 py-3.5 text-center">
                        <div className="flex items-center justify-center gap-2">
                          {onEdit && (
                            <button onClick={() => onEdit(row)} className="text-gray-300 hover:text-blue-500 transition-colors">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                              </svg>
                            </button>
                          )}
                          <button onClick={() => onDelete(row.id)} className="text-gray-300 hover:text-red-500 transition-colors">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr className={`bg-${theme}-50 border-t-2 border-${theme}-200`}>
                    <td className={`px-4 py-3.5 text-center font-bold text-${theme}-700`} colSpan={footerColSpan}>합계</td>
                    <td className={`px-4 py-3.5 text-center font-bold text-${theme}-700`}>{totals.videos}</td>
                    <td className={`px-4 py-3.5 text-center font-bold text-${theme}-700`}>{totals.runtime}</td>
                    <td className={`px-4 py-3.5 text-center font-bold text-${theme}-700`}>{totals.totalTime}</td>
                    <td className={`px-4 py-3.5 text-center font-bold text-${theme}-700`}>{totals.period}</td>
                    <td colSpan={2}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </section>
      );
    }

    function SummaryCard({ label, value, color, icon }) {
      const colorMap = { edit: 'edit-500', shoot: 'shoot-500', gray: 'gray-400', amber: 'amber-400' };
      const bgMap = { edit: 'edit-100', shoot: 'shoot-100', gray: 'gray-100', amber: 'amber-50' };
      const textMap = { edit: 'edit-600', shoot: 'shoot-600', gray: 'gray-500', amber: 'amber-600' };
      const icons = {
        video: <path d="M15 8v8H5V8h10m1-2H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4V7a1 1 0 00-1-1z"/>,
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
        clipboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />,
      };

      return (
        <div className="bg-white rounded-xl border border-gray-200 p-5 shadow-sm relative overflow-hidden">
          <div className={`absolute top-0 left-0 w-1 h-full bg-${colorMap[color]}`}></div>
          <div className="flex items-center gap-2 mb-1 ml-2">
            <span className={`w-7 h-7 rounded-lg bg-${bgMap[color]} flex items-center justify-center`}>
              <svg className={`w-4 h-4 text-${textMap[color]}`} fill={icon === 'video' ? 'currentColor' : 'none'} stroke={icon !== 'video' ? 'currentColor' : 'none'} viewBox="0 0 24 24">
                {icons[icon]}
              </svg>
            </span>
            <span className="text-xs text-gray-500 font-medium">{label}</span>
          </div>
          <p className="text-3xl font-bold text-gray-900 ml-2 mt-1">{value}</p>
        </div>
      );
    }

    function AddModal({ title, type, accent, initial, onClose, onAdd }) {
      const [form, setForm] = useState(() => initial ? {
        dept: initial.dept || '', content: initial.content || '', videos: String(initial.videos || ''), runtime: String(initial.runtime || ''), totalTime: String(initial.totalTime || ''), period: String(initial.period || ''), manager: initial.manager || ''
      } : { dept: '', content: '', videos: '', runtime: '', totalTime: '', period: '', manager: '' });
      const set = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.content || !form.manager) return;
        onAdd({
          ...(initial || {}),
          id: initial ? initial.id : Date.now(),
          no: initial ? initial.no : undefined,
          dept: form.dept,
          content: form.content,
          videos: Number(form.videos) || 0,
          runtime: Number(form.runtime) || 0,
          totalTime: Number(form.totalTime) || 0,
          period: Number(form.period) || 0,
          manager: form.manager,
        });
      };

      const ring = accent === 'edit' ? 'focus:ring-edit-300' : 'focus:ring-shoot-300';
      const btn = accent === 'edit' ? 'bg-edit-500 hover:bg-edit-600' : 'bg-shoot-500 hover:bg-shoot-600';

      const Field = ({ label, field, type: inputType = 'text', placeholder, required }) => (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
          <input
            type={inputType}
            value={form[field]}
            onChange={e => set(field, e.target.value)}
            className={`w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 ${ring}`}
            placeholder={placeholder}
            min={inputType === 'number' ? '0' : undefined}
            required={required}
          />
        </div>
      );

      return (
        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl" onClick={e => e.stopPropagation()}>
            <h3 className="text-lg font-bold mb-5">{title}</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              {type === 'edit' && <Field label="의뢰부서" field="dept" placeholder="예: 홍보팀" />}
              <Field label="컨텐츠" field="content" placeholder="컨텐츠명 입력" required />
              <div className="grid grid-cols-2 gap-3">
                <Field label="영상(편)" field="videos" type="number" />
                <Field label="러닝타임(분)" field="runtime" type="number" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="총 영상 시간(분)" field="totalTime" type="number" />
                <Field label={type === 'edit' ? '편집 기간(일)' : '촬영 기간(일)'} field="period" type="number" />
              </div>
              <Field label="담당자" field="manager" placeholder="담당자 이름" required />
              <div className="flex gap-3 pt-3">
                <button type="button" onClick={onClose} className="flex-1 border border-gray-300 text-gray-700 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition-colors">
                  취소
                </button>
                <button type="submit" className={`flex-1 text-white py-2.5 rounded-lg font-medium transition-colors ${btn}`}>
                  {initial ? '수정' : '추가'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function Root() {
      const [auth, setAuth] = useState(() => sessionStorage.getItem('authenticated') === 'true');
      if (!auth) return <LoginPage onLogin={() => setAuth(true)} />;
      return <App />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
